variables:
  CATALOG: prod_lake
  SQL_URL: "jdbc:sqlserver://sql-prod.example.net:1433;database=sales"
  STORAGE_ACCOUNT: stprodlanding
overrides:
  - entity: "*"
    path: target.catalog
    value: "${CATALOG}"
    action: add
options: {fail_when_entity_not_found: true, fail_when_path_not_found: true}
