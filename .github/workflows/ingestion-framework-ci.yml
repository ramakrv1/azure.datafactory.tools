name: ingestion-framework-ci

on:
  push:
    branches: [master, develop]
    paths: ['ingestion_framework/**', '.github/workflows/ingestion-framework-ci.yml']
  pull_request:
    branches: [master, develop]
    paths: ['ingestion_framework/**', '.github/workflows/ingestion-framework-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e "ingestion_framework[dev]"
      - run: pytest -q ingestion_framework/tests
